[package]
name = "storage-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "storage_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
rusqlite = { version = "0.38", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
